name: Deploy AI Workbench to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare public site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          files=(
            index.html
            comic-drama.html
            ecommerce-brand-video.html
            ecommerce-detail-page.html
            ecommerce-main-image.html
            ecommerce-model-video.html
            emotional-video.html
            watermark-remover.html
            xiaohongshu-4img1text.html
          )
          for file in "${files[@]}"; do
            test -f "$file"
            cp -- "$file" _site/
          done
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
